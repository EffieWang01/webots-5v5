/**:
  ros__parameters:
    game:
      team_id: 63 # must be consistent with GameControl
      player_id: 1 # 1 | 2 | 3 | 4 | 5
      # field_type presets (no rebuild):
      #   adult_size  ??14×9  (common practice / older pitch)
      #   robo_league ??22×14 (official 5v5 competition; matches sim)
      #   kid_size    ??9×6
      # Optional overrides (0 = keep preset): game.field_length / field_width / ??
      # See docx/reference/05_真机可迁移原??md §场地尺寸
      field_type: "robo_league" # adult_size | kid_size | robo_league
      player_role: "goal_keeper" # striker | goal_keeper | defender
    # v3 jersey notes: 3=mid (open-play), 4/5 strikers; set-play = cost-rank among strikers
      treat_person_as_robot: false
      number_of_players: 5
      sim_ground_truth: true
      
    robot:
      robot_name: "" # When multiple robots exist, specify e.g. "robot0", "robot1"; leave empty for single robot
      robot_height: 1.12 # 1.12 for T1
      odom_factor: 1.2 # 1.2 for T1
      vx_factor: 0.50
      yaw_offset: 0.0
      vx_limit: 1.0
      vy_limit: 0.4
      vtheta_limit: 1.2
      min_vx: 0.3 # Minimum x velocity when command is too small, to prevent no response
      min_vy: 0.3 # Minimum y velocity when command is too small, to prevent no response
      min_vtheta: 0.25 # Minimum theta velocity when command is too small, to prevent no response

    strategy:
      ball_confidence_threshold: 50.0
      ball_memory_timeout: 2.0
      tm_ball_dist_threshold: 2.0
      limit_near_ball_speed: false
      near_ball_speed_limit: 0.2
      near_ball_range: 3.0
      abort_kick_when_ball_moved: true
      soft_kickoff: false
      soft_kickoff_speed: 0.3
      ball_out_threshold: 2.0
      freekick_kicker_touch:
        enable: true
        close_dist: 0.40
        release_dist: 0.70
        cost_penalty: 100.0
        cost_penalty_msecs: 5000.0
      freekick_defense:
        exit_margin: 0.25 # 非开球方任意球时，只比规则避让半径多退一点，减少退得过??
        primary_buffer: 0.00 # 主力默认停在避让半径外一??
        goal_kick_primary_buffer: 0.00 # 门球时同样只退出避让半??
        secondary_buffer: 0.15 # 第二防守点只略微更远，主要靠横向展开
        secondary_lateral_offset: 0.35 # 第二防守点沿切线方向的横向展开距离
        field_margin_x: 0.35 # 站位点距底线/边界的最??X 安全边距
        field_margin_y: 0.60 # 站位点距边线的最??Y 安全边距
        own_penalty_exit_margin: 0.20 # 当任意球发生在本方禁区内时，额外退到禁区外的安全边??
        opponent_goal_kick_penalty_exit_margin: 0.50 # 对方门球时，防守方目标点位于对方大禁区线??0.5m
        opponent_goal_kick_ball_clearance: 0.70 # 对方门球退让路径与球至少保??0.7m 安全半径
        arrive_dist_tolerance: 0.25 # 防守任意球认为已到位的距离阈??
        arrive_theta_tolerance: 0.14 # 防守任意球认为已到位的朝向阈值，保证始终盯球
        ball_clearance: 0.30 # 防守任意球时任何贴球/回场动作至少保持 30cm
        path_ball_clearance: 0.30 # 移动路径与球过近时，强制优先后退/绕开的距离阈??
        goal_line_exception_x_margin: 0.20 # 球门线例外：判定机器人在本方球门线附近的 X 容差
        goal_line_exception_y_margin: 0.10 # 球门线例外：判定机器人在两门柱之间的额外 Y 容差
        fast_exit_back_speed: 0.55 # 仍在安全圈内时，优先正对球后退的目标速度
        fast_exit_release_margin: 0.04 # 快速退圈模式的释放边距，刚出避让半径就停止继续后退
        fast_exit_turn_gain: 2.20 # 快速退圈时朝向球的转向增益
        fast_exit_max_lateral: 0.08 # 快速退圈时允许的最大侧向修正，默认尽量少横??
        fast_exit_path_ball_clearance: 0.30 # 快速退圈阶段至少保??30cm，不再因为过大路径阈值退得很??
        boundary_arc_speed: 0.75 # 退到合法半径后，沿避让圆弧快速移动到最佳站位的速度上限
        boundary_arc_radius_margin: 0.06 # 圆弧移动时相对避让半径保留的额外安全边距
        boundary_arc_step: 0.55 # 每次圆弧切向追踪的最大角度步长，越大越果??
        boundary_arc_min_angle: 0.10 # 角度差超过该值时优先沿圆弧切向移??
        boundary_arc_direct_dist: 0.45 # 距离最佳点仍超过该值时，即使角度差不大也用快速边界移??
      cooperation:
        enable_role_switch: false
        ball_control_cost_threshold: 20.0
      roles:
        # Deterministic 5v5 role assignment. Every robot computes the same table from the same available-player set.
        candidates:
          goalkeeper: [1, 2, 3, 5, 4]
          primary_striker: [4, 5, 3, 2, 1]
          defender: [2, 3, 5, 4, 1]
          midfielder: [3, 5, 2, 4, 1]
          secondary_striker: [5, 3, 4, 2, 1]
        # Ordinary center kickoff taker order. Goalkeeper is intentionally excluded.
        kickoff_taker_order: [4, 5, 3, 2]
        # Role and availability hysteresis.
        role_switch_stable_msecs: 1200.0
        teammate_temp_missing_msecs: 1500.0
        teammate_unavailable_msecs: 5000.0
        rejoin_stable_msecs: 1500.0
        # Lead election hysteresis and cost shaping. assignedRole stays stable; is_lead can switch.
        lead_switch_stable_msecs: 500.0
        lead_switch_advantage: 0.60
        recovery_cost_penalty: 15.0
        communication_cost_penalty: 4.0
        lead_cost_penalty:
          primary_striker: 0.0
          secondary_striker: 0.8
          midfielder: 2.0
          defender: 4.0
          goalkeeper: 1000.0
          unknown: 8.0
        # Kickoff lock release: ball moved from initial kickoff position or timeout.
        kickoff_complete_distance: 0.35
        kickoff_timeout_msecs: 8000.0      # v3: set-play cost-rank taker + open-play anti-crowd (see 04_brain_v3_优化计划.md)
      v3:
        enable: true
        r_crowd: 1.3
        lead_stable_ms: 500.0
        lead_prefer_jersey: 4          # open-play lead bias only
        lead_secondary_jersey: 5
        lead_midfielder_jersey: 3
        lead_secondary_margin: 1.5
        midfielder_cost_penalty: 12.0  # disabled during FREE_KICK
        prefer_jersey_cost_bonus: 1.2  # disabled during FREE_KICK
        assist_primary_behind: 1.8
        assist_secondary_behind: 2.3
        assist_lateral: 1.5
        secondary_run_trigger_x: 0.0
        secondary_run_ahead: 1.2
        secondary_far_post_trigger: 3.5
        secondary_far_post_x_margin: 1.4
        secondary_far_post_y: 1.2
        setplay_support_min_dist: 4.0   # throw-in/corner support ??m into pitch
        setplay_defense_min_dist: 3.2   # opponent throw-in/corner wall
        setplay_approach_dist: 0.50
        setplay_corner_approach_dist: 0.38  # closer stand for corner pin
        setplay_post_hold_ms: 1500.0
        ball_stuck_force_chase_ms: 1500.0
        throw_in_inward_blend: 0.85
        corner_inward_blend: 0.90
        setplay_close_kick_range: 0.62  # A7f: tight foot-front before kick
        setplay_orbit_timeout_ms: 10000.0  # behind+aim first; soft kick only after long orbit
        setplay_force_kick_near_ms: 10000.0
        setplay_force_kick_near_range: 0.75

    obstacle_avoidance:
      depth_sample_step: 16
      obstacle_min_height: 0.45
      grid_size: 0.2
      max_x: 3.0
      max_y: 5.0
      exclusion_x: 0.4
      exclusion_y: 0.5
      ball_exclusion_radius: 0.0
      ball_exclusion_height: 0.3
      occupancy_threshold: 2000.0
      collision_threshold: 0.3
      safe_distance: 2.0
      avoid_secs: 3.0
      enable_freekick_avoid: false
      freekick_start_placing_safe_distance: 0.1
      freekick_start_placing_avoid_secs: 2.5
      obstacle_memory_msecs: 500.0
      avoid_during_kick: false
      kick_ao_safe_dist: 3.0
      avoid_during_chase: true
      chase_ao_safe_dist: 3.5

    RLVisionKick:
      enableAutoVisualKick: false
      autoVisualKickEnableDistMin: 0.2
      autoVisualKickEnableDistMax: 4.0
      autoVisualKickEnableAngle: 0.8
      lowPassPower: 1.8
      highPassPower: 2.5
      visualKickVersion: kV2  # kV1|kV2

    locator:
      min_marker_count: 5
      # Enter-field residuals were ~0.41-0.60 on this field; 0.35 was rejecting all fixes.
      max_residual: 0.55

    enable_com: true
    team_comm_frequency_hz: 1.0  # 队内通信广播频率(Hz)，默??2Hz；RoboCup 规则上限 2 ??秒，超过会告警但仍生??
    
    recovery:
      retry_max_count: 3
      fallen_stable_msecs: 500.0
      getup_retry_msecs: 4000.0
      verify_stable_msecs: 500.0
      failed_cooldown_msecs: 3000.0
      reset_odom_after_getup: false

    vision:
        # image_camera_info_topic: "/camera/camera/color/camera_info" # realsense
        # depth_image_topic: "/camera/camera/aligned_depth_to_color/image_raw" # realsense
        # depth_camera_info_topic: "/camera/camera/aligned_depth_to_color/camera_info" # realsense

        # image_camera_info_topic: "/zed/zed_node/left/camera_info" # zed
        # depth_image_topic: "/zed/zed_node/depth/depth_registered" # zed
        # depth_camera_info_topic: "/zed/zed_node/depth/camera_info" # zed

        # image_camera_info_topic: "/boostercamera/head/rgb/camera_info" # d-robotics
        # depth_image_topic: "/boostercamera/head/depth" # d-robotics
        # depth_camera_info_topic: "/boostercamera/head/depth/camera_info" # d-robotics

        image_camera_info_topic: "/boostercamera/head/rgb/camera_info" # T1
        depth_image_topic: "/boostercamera/head/depth" # T1
        depth_camera_info_topic: "/boostercamera/head/depth/camera_info" # T1

        # image_camera_info_topic: "/camera/robot0_rgbd_camera/rgb/camera_info" # simulated
        # depth_image_topic: "/camera/robot0_rgbd_camera/depth/image_raw" # simulated
        # depth_camera_info_topic: "/camera/robot0_rgbd_camera/depth/camera_info" # simulated
    
    # game_control_ip: "10.155.89.189"  # Jiale's personal WLAN IP
    game_control_ip: "10.39.222.189"
