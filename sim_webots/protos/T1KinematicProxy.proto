#VRML_SIM R2025a utf8
# tags: robot/walking
# Lightweight T1-shaped kinematic proxy; NOT the official 23-DoF joint model.

PROTO T1KinematicProxy [
  field SFVec3f    translation 0 0 0
  field SFRotation rotation 0 0 1 0
  field SFString   name "T1_KINEMATIC_PROXY"
  field SFString   controller "<none>"
  field SFString   customData ""
  field SFColor    teamColor 0.8 0.05 0.05
]
{
